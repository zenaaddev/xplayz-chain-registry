# PR 은 검사만, main 에 들어오거나 예약 시각·수동 실행이면 검사 → 합친 파일 + 받는 체인 목록을 GitHub Pages 로 배포한다.
name: registry

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 받는 체인 목록(ibc-destinations.json)을 하루 한 번 새로 만든다 — 03:17 UTC(12:17 KST).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - run: node --check scripts/ibc-destinations.mjs
      # Skip 에 물어 받는 체인 목록을 만든다. 하나라도 끝내 실패하거나 결과가 비정상이면 파일을 안 쓰고,
      # 지금 배포된 파일을 그대로 다시 올린다(빈·일부 목록으로 덮지 않는다). 첫 배포라 그것도 없으면 이 작업이 실패해 지금 배포가 남는다.
      - if: github.event_name != 'pull_request'
        env:
          SKIP_API_KEY: ${{ secrets.SKIP_API_KEY }}
        run: |
          node scripts/ibc-destinations.mjs || {
            echo "::warning::받는 체인 목록을 새로 만들지 못했다 — 지금 배포된 파일을 다시 올린다"
            curl -fsSL --max-time 30 "https://zenaaddev.github.io/xplayz-chain-registry/ibc-destinations.json" -o dist/ibc-destinations.json
          }
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
